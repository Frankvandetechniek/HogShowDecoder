name: Release

# Two ways to publish a GitHub release:
#  * push a tag like v0.1.0, or
#  * run this workflow by hand (Actions tab -> Release -> Run workflow); it then
#    creates the tag v<hogshow.__version__> on the selected commit itself.
# Release notes are read from .github/release-notes/<tag>.md when that file exists.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Work out the release tag
        run: |
          version=$(python -c "import hogshow; print(hogshow.__version__)")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "Tag $GITHUB_REF_NAME does not match hogshow.__version__ ($version)"
              exit 1
            fi
          fi
          echo "TAG=v$version" >> "$GITHUB_ENV"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 1
          fi
          notes=".github/release-notes/${TAG}.md"
          if [ -f "$notes" ]; then
            notes_args=(--notes-file "$notes")
          else
            notes_args=(--generate-notes)
          fi
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" \
            --title "HogShowDecoder $TAG" "${notes_args[@]}"
